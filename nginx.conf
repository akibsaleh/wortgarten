server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/html application/javascript text/css application/json application/manifest+json;
    gzip_min_length 256;

    # --- Static asset caching (immutable hashed filenames from Vite) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Service worker: never cache. nginx's default mime.types has no
    #     .webmanifest entry (served as application/octet-stream without
    #     this), and an unversioned sw.js/workbox-*.js left cacheable can
    #     strand a browser on a stale worker after a deploy — the update
    #     check itself depends on re-fetching this file. ---
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # --- SPA fallback for client-side routing ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- No-cache for index.html so updates propagate ---
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
