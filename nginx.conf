server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/html application/javascript text/css application/json;
    gzip_min_length 256;

    # --- Static asset caching (immutable hashed filenames from Vite) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA fallback for client-side routing ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- No-cache for index.html so updates propagate ---
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
